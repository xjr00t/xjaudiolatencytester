name: Release

on:
  push:
    tags:
      - 'v*.*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Publish single EXE
        run: |
          dotnet publish XJAudioLatencyTester.csproj -c Release -o dist
          Compress-Archive `
            -Path dist/XJAudioLatencyTester.exe, dist/XJAudioLatencyTester.exe.config `
            -DestinationPath "XJAudioLatencyTester-${{ github.ref_name }}-win.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "XJ Audio Latency Tester ${{ github.ref_name }}"
          files: |
            XJAudioLatencyTester-${{ github.ref_name }}-win.zip
            dist/XJAudioLatencyTester.exe
